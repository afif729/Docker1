apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board
  labels:
    app: notice-board
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notice-board
  template:
    metadata:
      labels:
        app: notice-board
    spec:
      containers:
        - name: notice-board
          image: afif729/notice-board:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board-service
spec:
  type: NodePort
  selector:
    app: notice-board
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010
